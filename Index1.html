<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live TV - IPTV Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --bg: #0a0a0a;
            --surface: #1a1a1a;
            --card: #252525;
            --text: #ffffff;
            --text-muted: #aaaaaa;
            --accent: #e50914;
            --accent-hover: #f6121d;
            --focus: #404040;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .header {
            position: sticky;
            top: 0;
            background: var(--bg);
            padding: 15px 20px;
            z-index: 100;
            border-bottom: 1px solid var(--surface);
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1400px;
            margin: 0 auto;
            gap: 20px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--accent);
            text-decoration: none;
            white-space: nowrap;
        }

        .search-bar {
            flex: 1;
            max-width: 300px;
            position: relative;
        }

        .search-bar input {
            width: 100%;
            padding: 10px 15px;
            background: var(--surface);
            border: 1px solid var(--card);
            border-radius: 8px;
            color: var(--text);
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .search-bar input:focus {
            border-color: var(--accent);
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4caf50;
            animation: pulse 2s infinite;
        }

        .status-dot.loading {
            background: #ff9800;
        }

        .status-dot.error {
            background: #f44336;
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .main-layout {
            display: flex;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            height: calc(100vh - 70px);
        }

        .player-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-width: 0;
        }

        .player-section {
            position: relative;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 16/9;
            max-height: 70vh;
            flex-shrink: 0;
        }

        #video-player {
            width: 100%;
            height: 100%;
            display: block;
        }

        .player-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 15px;
            color: var(--text-muted);
            font-size: 18px;
        }

        .player-placeholder .icon {
            font-size: 48px;
            opacity: 0.5;
        }

        .player-controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .control-btn {
            background: var(--card);
            border: 1px solid var(--focus);
            color: var(--text);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .control-btn:hover {
            background: var(--focus);
            border-color: var(--accent);
        }

        .control-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .control-btn.download {
            background: var(--accent);
            border-color: var(--accent);
        }

        .control-btn.download:hover {
            background: var(--accent-hover);
        }

        .channels-sidebar {
            width: 350px;
            min-width: 350px;
            background: var(--surface);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-header {
            padding: 15px;
            border-bottom: 1px solid var(--card);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-title {
            font-size: 16px;
            font-weight: bold;
        }

        .channel-count {
            font-size: 12px;
            color: var(--text-muted);
        }

        .channels-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .channels-list::-webkit-scrollbar {
            width: 8px;
        }

        .channels-list::-webkit-scrollbar-track {
            background: var(--surface);
        }

        .channels-list::-webkit-scrollbar-thumb {
            background: var(--focus);
            border-radius: 4px;
        }

        .channel-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 5px;
        }

        .channel-item:hover {
            background: var(--card);
        }

        .channel-item.active {
            background: var(--focus);
            border-left: 3px solid var(--accent);
        }

        .channel-item .channel-number {
            width: 30px;
            text-align: center;
            font-weight: bold;
            color: var(--text-muted);
            font-size: 12px;
        }

        .channel-item .channel-logo {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--card);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: var(--accent);
            overflow: hidden;
            flex-shrink: 0;
        }

        .channel-item .channel-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .channel-item .channel-info {
            flex: 1;
            min-width: 0;
        }

        .channel-item .channel-name {
            font-size: 14px;
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .channel-item .channel-group {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .download-progress {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--surface);
            border: 1px solid var(--card);
            border-radius: 12px;
            padding: 20px;
            width: 300px;
            z-index: 1000;
            display: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .download-progress.visible {
            display: block;
        }

        .download-progress .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .download-progress .progress-title {
            font-weight: bold;
            font-size: 14px;
        }

        .download-progress .progress-bar {
            width: 100%;
            height: 6px;
            background: var(--card);
            border-radius: 3px;
            overflow: hidden;
        }

        .download-progress .progress-fill {
            height: 100%;
            background: var(--accent);
            transition: width 0.3s;
            width: 0%;
        }

        .download-progress .progress-text {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 8px;
            text-align: center;
        }

        .error-message {
            background: rgba(244, 67, 54, 0.1);
            border: 1px solid #f44336;
            color: #f44336;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-state .icon {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state h3 {
            font-size: 24px;
            margin-bottom: 10px;
            color: var(--text);
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid var(--text-muted);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 1024px) {
            .main-layout {
                flex-direction: column;
                height: auto;
            }

            .channels-sidebar {
                width: 100%;
                min-width: 0;
                max-height: 400px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <a href="/" class="logo">📺 MyTV</a>
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="Search channels..." oninput="filterChannels(this.value)">
            </div>
            <div class="status">
                <span class="status-dot" id="status-dot"></span>
                <span id="status-text">Loading...</span>
            </div>
        </div>
    </div>

    <div class="main-layout">
        <div class="player-column">
            <div class="player-section" id="player-section">
                <video id="video-player" controls></video>
                <div class="player-placeholder" id="player-placeholder">
                    <span class="icon">📡</span>
                    <span>Select a channel to start watching</span>
                </div>
            </div>

            <div class="player-controls">
                <button class="control-btn" onclick="playPreviousChannel()" id="prev-btn" disabled>
                    ⬅️ Previous
                </button>
                <button class="control-btn" onclick="playNextChannel()" id="next-btn" disabled>
                    Next ➡️
                </button>
                <button class="control-btn download" onclick="downloadCurrentStream()" id="download-btn" disabled>
                    ⬇️ Download
                </button>
                <button class="control-btn" onclick="stopDownload()" id="stop-download-btn" disabled style="display: none;">
                    ⏹️ Stop Download
                </button>
            </div>

            <div id="error-message" class="error-message"></div>
        </div>

        <div class="channels-sidebar">
            <div class="sidebar-header">
                <span class="sidebar-title">Channels</span>
                <span class="channel-count" id="channel-count">0 channels</span>
            </div>
            <div class="channels-list" id="channels-list">
                <div class="empty-state" id="loading-state">
                    <div class="loading-spinner"></div>
                    <p style="margin-top: 15px;">Loading channels...</p>
                </div>
            </div>
        </div>
    </div>

    <div class="download-progress" id="download-progress">
        <div class="progress-header">
            <span class="progress-title" id="download-title">Downloading...</span>
            <button class="control-btn" onclick="stopDownload()" style="padding: 5px 10px; font-size: 12px;">Cancel</button>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="progress-text" id="progress-text">0%</div>
    </div>

    <script>
        // CHANGE THIS URL to your GitHub raw playlist URL
        const PLAYLIST_URL = 'https://github.com/yourname/yourrepo/blob/main/playlist.m3u';
        
        let channels = [];
        let currentChannelIndex = -1;
        let hls = null;
        let video = document.getElementById('video-player');
        let mediaRecorder = null;
        let recordedChunks = [];
        let isDownloading = false;
        
        // Update status
        function updateStatus(text, state = 'loading') {
            document.getElementById('status-text').textContent = text;
            document.getElementById('status-dot').className = 'status-dot ' + state;
        }
        
        // Parse M3U playlist
        function parseM3U(content) {
            const lines = content.split('\n');
            const channels = [];
            let currentChannel = null;
            
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                
                if (line.startsWith('#EXTINF')) {
                    const nameMatch = line.match(/,(.+)$/);
                    const groupMatch = line.match(/group-title="([^"]*)"/);
                    const logoMatch = line.match(/tvg-logo="([^"]*)"/);
                    
                    currentChannel = {
                        name: nameMatch ? nameMatch[1].trim() : 'Unknown Channel',
                        group: groupMatch ? groupMatch[1] : 'General',
                        logo: logoMatch ? logoMatch[1] : null,
                        url: null
                    };
                } else if (line && !line.startsWith('#') && currentChannel) {
                    currentChannel.url = line;
                    channels.push(currentChannel);
                    currentChannel = null;
                }
            }
            
            return channels;
        }
        
        // Load playlist
        async function loadPlaylist() {
            updateStatus('Loading playlist...', 'loading');
            
            try {
                const response = await fetch(PLAYLIST_URL);
                if (!response.ok) {
                    throw new Error(`Failed to load playlist: ${response.status}`);
                }
                
                const content = await response.text();
                channels = parseM3U(content);
                
                if (channels.length === 0) {
                    throw new Error('No channels found in playlist');
                }
                
                updateStatus(`${channels.length} channels`, '');
                renderChannels(channels);
                updateChannelCount();
                enableChannelButtons();
            } catch (error) {
                console.error('Error loading playlist:', error);
                updateStatus('Error', 'error');
                showError(error.message);
                renderEmptyState();
            }
        }
        
        // Render channels
        function renderChannels(channelList) {
            const list = document.getElementById('channels-list');
            
            if (channelList.length === 0) {
                renderEmptyState();
                return;
            }
            
            list.innerHTML = channelList.map((channel, index) => {
                const globalIndex = channels.indexOf(channel);
                return `
                    <div class="channel-item ${globalIndex === currentChannelIndex ? 'active' : ''}" onclick="playChannel(${globalIndex})">
                        <div class="channel-number">${globalIndex + 1}</div>
                        <div class="channel-logo">
                            ${channel.logo ? `<img src="${channel.logo}" alt="${channel.name}">` : channel.name.charAt(0).toUpperCase()}
                        </div>
                        <div class="channel-info">
                            <div class="channel-name">${channel.name}</div>
                            <div class="channel-group">${channel.group}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function renderEmptyState() {
            document.getElementById('channels-list').innerHTML = `
                <div class="empty-state">
                    <span class="icon">📭</span>
                    <h3>No Channels Available</h3>
                    <p>Unable to load channels. Please check the playlist URL.</p>
                </div>
            `;
        }
        
        function updateChannelCount() {
            document.getElementById('channel-count').textContent = `${channels.length} channels`;
        }
        
        function enableChannelButtons() {
            document.getElementById('prev-btn').disabled = channels.length === 0;
            document.getElementById('next-btn').disabled = channels.length === 0;
            document.getElementById('download-btn').disabled = channels.length === 0;
        }
        
        // Play channel
        function playChannel(index) {
            if (index < 0 || index >= channels.length) return;
            
            const channel = channels[index];
            if (!channel || !channel.url) return;
            
            currentChannelIndex = index;
            
            // Update UI
            document.querySelectorAll('.channel-item').forEach((item, i) => {
                item.classList.toggle('active', i === index);
            });
            
            document.getElementById('player-placeholder').style.display = 'none';
            document.getElementById('download-btn').disabled = false;
            
            // Stop existing playback
            stopPlayback();
            
            // Play stream
            if (channel.url.includes('.m3u8')) {
                if (Hls.isSupported()) {
                    hls = new Hls();
                    hls.loadSource(channel.url);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, () => {
                        video.play();
                    });
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = channel.url;
                    video.play();
                }
            } else {
                video.src = channel.url;
                video.play();
            }
            
            updateStatus(`Playing: ${channel.name}`, '');
            
            // Scroll to active channel
            const activeItem = document.querySelector('.channel-item.active');
            if (activeItem) {
                activeItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }
        
        function playNextChannel() {
            if (channels.length === 0) return;
            const nextIndex = (currentChannelIndex + 1) % channels.length;
            playChannel(nextIndex);
        }
        
        function playPreviousChannel() {
            if (channels.length === 0) return;
            const prevIndex = (currentChannelIndex - 1 + channels.length) % channels.length;
            playChannel(prevIndex);
        }
        
        function stopPlayback() {
            if (hls) {
                hls.destroy();
                hls = null;
            }
            video.pause();
            video.src = '';
            video.load();
        }
        
        // Download current stream
        function downloadCurrentStream() {
            if (currentChannelIndex < 0 || currentChannelIndex >= channels.length) return;
            
            const channel = channels[currentChannelIndex];
            
            // For direct download links
            if (channel.url.includes('.mp4') || channel.url.includes('.m3u8') === false) {
                // Direct download
                const link = document.createElement('a');
                link.href = channel.url;
                link.download = `${channel.name}.mp4`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                return;
            }
            
            // For HLS streams - use MediaRecorder
            if (typeof MediaRecorder === 'undefined') {
                alert('Download not supported in this browser. Try Chrome or Firefox.');
                return;
            }
            
            // Check if video is playing
            if (!video.src && !hls) {
                alert('Please start playing the channel first.');
                return;
            }
            
            // Stop any existing download
            if (isDownloading) {
                stopDownload();
            }
            
            try {
                const stream = video.captureStream ? video.captureStream() : video.mozCaptureStream();
                mediaRecorder = new MediaRecorder(stream, {
                    mimeType: 'video/webm'
                });
                
                recordedChunks = [];
                isDownloading = true;
                
                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        recordedChunks.push(event.data);
                    }
                };
                
                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = `${channel.name}.webm`;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(url);
                    
                    isDownloading = false;
                    document.getElementById('download-btn').style.display = 'flex';
                    document.getElementById('stop-download-btn').style.display = 'none';
                    document.getElementById('download-progress').classList.remove('visible');
                };
                
                mediaRecorder.start(1000); // Collect data every second
                
                // Update UI
                document.getElementById('download-btn').style.display = 'none';
                document.getElementById('stop-download-btn').style.display = 'flex';
                document.getElementById('download-progress').classList.add('visible');
                document.getElementById('download-title').textContent = `Downloading: ${channel.name}`;
                document.getElementById('progress-fill').style.width = '0%';
                document.getElementById('progress-text').textContent = 'Recording...';
                
                updateStatus(`Downloading: ${channel.name}`, 'loading');
            } catch (error) {
                console.error('Download error:', error);
                alert('Unable to download stream. Try using a download manager or different browser.');
            }
        }
        
        function stopDownload() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            
            isDownloading = false;
            document.getElementById('download-btn').style.display = 'flex';
            document.getElementById('stop-download-btn').style.display = 'none';
            document.getElementById('download-progress').classList.remove('visible');
            updateStatus('', '');
        }
        
        // Filter channels
        function filterChannels(query) {
            const filtered = channels.filter(channel => 
                channel.name.toLowerCase().includes(query.toLowerCase()) ||
                channel.group.toLowerCase().includes(query.toLowerCase())
            );
            renderChannels(filtered);
        }
        
        // Show error
        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }
        
        // Keyboard shortcuts
        document.addEventListener('keydown', (event) => {
            switch(event.key) {
                case 'ArrowUp':
                case 'ArrowLeft':
                    event.preventDefault();
                    playPreviousChannel();
                    break;
                case 'ArrowDown':
                case 'ArrowRight':
                    event.preventDefault();
                    playNextChannel();
                    break;
                case 'd':
                case 'D':
                    if (event.ctrlKey || event.metaKey) {
                        event.preventDefault();
                        downloadCurrentStream();
                    }
                    break;
            }
        });
        
        // Initialize
        loadPlaylist();
    </script>
</body>
</html>
